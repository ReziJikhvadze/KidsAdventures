name: CI

# Every push and every PR. The point is that a broken build cannot reach master
# unnoticed, and that a secret can never be committed again without someone being told.
on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  # A newer push makes an in-flight run irrelevant; cancel it rather than pay for it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0

      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Without this every run downloads the whole package graph again. The key is the
      # project file, so the cache is only rebuilt when a dependency actually changes.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore KidsAdventuresAPI/KidsAdventuresAPI.csproj

      - name: Build
        # SkipFrontendBuild keeps the csproj's npm target out of the API job; the
        # frontend has its own job below and does not need building twice.
        run: >
          dotnet build KidsAdventuresAPI/KidsAdventuresAPI.csproj
          --no-restore -c Release -p:SkipFrontendBuild=true
          -warnaserror

  # Whether the schema changed at all. Standing up SQL Server pulls a 1.5GB image and
  # boots the whole application — several minutes — to answer a question that can only
  # have changed if a migration, the data layer or the startup path changed.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            schema:
              - 'KidsAdventuresAPI/Data/**'
              - 'KidsAdventuresAPI/Repositories/**'
              - 'KidsAdventuresAPI/Program.cs'
              - 'KidsAdventuresAPI/Extensions/**'
              - 'KidsAdventuresAPI/**/*.csproj'
              - '.github/workflows/ci.yml'

  migrations:
    name: Migrations apply cleanly
    needs: changes
    if: ${{ needs.changes.outputs.schema == 'true' }}
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Local_CI_Password_1"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Local_CI_Password_1 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Migrations run at application startup, so "does the app boot" and "do the
      # migrations apply" are the same question. Booting against an empty database
      # answers both, and catches a bad .sql before it reaches Azure SQL.
      - name: Boot against a blank database
        working-directory: KidsAdventuresAPI
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5000
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=CiVerify;User Id=sa;Password=Local_CI_Password_1;TrustServerCertificate=True;Encrypt=False;"
          # appsettings.json selects Gemini for stories, and ServiceCollectionExtensions refuses
          # to boot without a key for it — "Gemini is selected in Providers but Gemini:ApiKey is
          # empty." This step only proves the migrations apply; it never calls a model, so a
          # placeholder is the honest value to hand it.
          Gemini__ApiKey: "ci-boot-placeholder"
        run: |
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Local_CI_Password_1 \
            -Q "CREATE DATABASE CiVerify" 2>/dev/null || \
            docker exec $(docker ps -qf ancestor=mcr.microsoft.com/mssql/server:2022-latest) \
            /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Local_CI_Password_1 \
            -Q "CREATE DATABASE CiVerify"
          dotnet run -c Release --no-launch-profile -p:SkipFrontendBuild=true &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/api/auth/config > /dev/null; then
              echo "API booted and migrations applied."
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy — check migration output above."
          exit 1

  frontend:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KidsAdventuresAPI/wwwroot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: KidsAdventuresAPI/wwwroot/package-lock.json

      - run: npm ci

      # Typecheck and lint read the same files but do not depend on each other, so they
      # run together rather than one after the other. `wait` without an argument returns
      # the first non-zero exit, so a failure in either still fails the job.
      - name: Typecheck and lint
        run: |
          npx tsc --noEmit -p tsconfig.json & tsc_pid=$!
          npm run lint & lint_pid=$!
          failed=0
          wait $tsc_pid || failed=1
          wait $lint_pid || failed=1
          exit $failed

      - name: Build
        run: npm run build
